<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - AutoTrace Enterprise</title>
    <meta name="description" content="Crea tu cuenta en el Sistema AutoTrace para gestionar el taller automotriz según tu rol.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg-dark: #0a0f1e;
        }
        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Fondo animado */
        .bg-orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.2; animation: floatOrb 8s ease-in-out infinite alternate; }
        .orb-1 { width: 500px; height: 500px; background: #7c3aed; top: -150px; right: -100px; }
        .orb-2 { width: 400px; height: 400px; background: #0891b2; bottom: -100px; left: -100px; animation-delay: 3s; }
        @keyframes floatOrb { from { transform: scale(1); } to { transform: scale(1.15) translate(15px, -15px); } }

        .register-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 560px;
        }

        .register-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .brand-header { text-align: center; margin-bottom: 1.75rem; }
        .back-link {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: #64748b; font-size: 0.85rem; text-decoration: none;
            margin-bottom: 1rem; transition: color 0.2s;
        }
        .back-link:hover { color: #94a3b8; }

        h1.page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem; font-weight: 800;
            color: #ffffff; letter-spacing: -0.03em; margin: 0;
        }
        .page-subtitle { color: #475569; font-size: 0.875rem; margin-top: 0.3rem; }

        .form-label {
            color: #94a3b8; font-size: 0.8rem;
            font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.06em; margin-bottom: 0.45rem;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.06) !important;
            border: 1px solid rgba(255,255,255,0.12) !important;
            color: #ffffff !important;
            border-radius: 12px !important;
            padding: 0.75rem 1rem !important;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.09) !important;
            border-color: rgba(37,99,235,0.6) !important;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.2) !important;
        }
        .form-control::placeholder { color: #334155 !important; }
        .form-select option { background: #1e293b; color: #e2e8f0; }

        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper .bi {
            position: absolute; left: 1rem; top: 50%;
            transform: translateY(-50%); color: #475569; z-index: 2;
        }
        .input-icon-wrapper .form-control { padding-left: 2.75rem !important; }

        /* Selector de roles con colores */
        .role-selector { display: grid; grid-template-columns: repeat(5,1fr); gap: 0.5rem; margin-top: 0.4rem; }
        .role-opt { display: none; }
        .role-opt + label {
            display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
            padding: 0.65rem 0.3rem; border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.08);
            cursor: pointer; transition: all 0.2s ease;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.04em; color: #64748b;
        }
        .role-opt + label i { font-size: 1.3rem; }
        .role-opt + label:hover { border-color: rgba(255,255,255,0.2); color: #94a3b8; background: rgba(255,255,255,0.04); }

        #rol-ADMINISTRADOR + label { color: #f87171; }
        #rol-ADMINISTRADOR:checked + label { background: rgba(248,113,113,0.15); border-color: #f87171; color: #f87171; }
        #rol-MECANICO + label { color: #fbbf24; }
        #rol-MECANICO:checked + label { background: rgba(251,191,36,0.15); border-color: #fbbf24; color: #fbbf24; }
        #rol-CLIENTE + label { color: #60a5fa; }
        #rol-CLIENTE:checked + label { background: rgba(96,165,250,0.15); border-color: #60a5fa; color: #60a5fa; }
        #rol-PROVEEDOR + label { color: #4ade80; }
        #rol-PROVEEDOR:checked + label { background: rgba(74,222,128,0.15); border-color: #4ade80; color: #4ade80; }
        #rol-AUDITOR + label { color: #a78bfa; }
        #rol-AUDITOR:checked + label { background: rgba(167,139,250,0.15); border-color: #a78bfa; color: #a78bfa; }

        /* Strength bar de contraseña */
        .strength-bar { height: 4px; border-radius: 9999px; background: rgba(255,255,255,0.08); margin-top: 0.5rem; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 9999px; transition: width 0.3s ease, background 0.3s ease; width: 0%; }

        .btn-register {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            border: none; border-radius: 12px; padding: 0.85rem;
            font-size: 1rem; font-weight: 700; color: white; width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }
        .btn-register:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(124,58,237,0.45); }
        .btn-register:active { transform: translateY(0); }

        .alert-error {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5; border-radius: 10px; padding: 0.75rem 1rem;
            font-size: 0.88rem; display: flex; align-items: center; gap: 0.6rem;
            margin-bottom: 1.25rem;
        }

        .login-link { text-align: center; font-size: 0.88rem; color: #475569; margin-top: 1rem; }
        .login-link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }

        .invalid-feedback { color: #f87171 !important; font-size: 0.8rem; }
        .form-control.is-invalid { border-color: rgba(239,68,68,0.5) !important; }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="register-container">
        <a th:href="@{/login}" class="back-link">
            <i class="bi bi-arrow-left"></i> Volver al login
        </a>

        <div class="register-card">
            <div class="brand-header">
                <h1 class="page-title"><i class="bi bi-person-plus-fill me-2" style="color:#7c3aed;"></i>Crear Cuenta</h1>
                <p class="page-subtitle">Completa los datos para unirte al sistema AutoTrace</p>
            </div>

            <!-- Error de registro -->
            <div th:if="${errorRegistro}" class="alert-error">
                <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
                <span th:text="${errorRegistro}">Error</span>
            </div>

            <form id="form-registro" th:action="@{/registro}" method="post" novalidate>

                <!-- Nombre -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-person-fill"></i>
                        <input type="text" class="form-control" id="nombre" name="nombre"
                               placeholder="Ej: Juan Carlos Pérez" required minlength="3">
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-envelope-fill"></i>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="tu@correo.com" required autocomplete="email">
                    </div>
                </div>

                <!-- Teléfono -->
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-telephone-fill"></i>
                        <input type="tel" class="form-control" id="telefono" name="telefono"
                               placeholder="Ej: 3001234567" required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-1">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-icon-wrapper" style="position:relative;">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Mínimo 6 caracteres" required minlength="6"
                               oninput="checkStrength(this.value)"
                               style="padding-right: 3rem !important;">
                        <button type="button" class="btn-toggle-pass" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#475569;cursor:pointer;z-index:2;" onclick="togglePass('password','eye1')">
                            <i class="bi bi-eye" id="eye1"></i>
                        </button>
                    </div>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <small id="strengthText" style="color:#475569;font-size:0.75rem;"></small>
                </div>

                <!-- Confirmar contraseña -->
                <div class="mb-3 mt-3">
                    <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
                    <div class="input-icon-wrapper" style="position:relative;">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" class="form-control" id="confirmarPassword" name="confirmarPassword"
                               placeholder="Repite tu contraseña" required
                               style="padding-right: 3rem !important;">
                        <button type="button" class="btn-toggle-pass" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#475569;cursor:pointer;z-index:2;" onclick="togglePass('confirmarPassword','eye2')">
                            <i class="bi bi-eye" id="eye2"></i>
                        </button>
                    </div>
                    <small id="passMatch" style="font-size:0.75rem;"></small>
                </div>

                <!-- Selector de Rol -->
                <div class="mb-4">
                    <label class="form-label d-block mb-1">Selecciona tu rol en el taller</label>
                    <div class="role-selector">
                        <input type="radio" class="role-opt" name="rol" id="rol-ADMINISTRADOR" value="ADMINISTRADOR">
                        <label for="rol-ADMINISTRADOR"><i class="bi bi-shield-shaded"></i>Admin</label>

                        <input type="radio" class="role-opt" name="rol" id="rol-MECANICO" value="MECANICO" checked>
                        <label for="rol-MECANICO"><i class="bi bi-tools"></i>Mecánico</label>

                        <input type="radio" class="role-opt" name="rol" id="rol-CLIENTE" value="CLIENTE">
                        <label for="rol-CLIENTE"><i class="bi bi-person-heart"></i>Cliente</label>

                        <input type="radio" class="role-opt" name="rol" id="rol-PROVEEDOR" value="PROVEEDOR">
                        <label for="rol-PROVEEDOR"><i class="bi bi-truck"></i>Proveedor</label>

                        <input type="radio" class="role-opt" name="rol" id="rol-AUDITOR" value="AUDITOR">
                        <label for="rol-AUDITOR"><i class="bi bi-award"></i>Auditor</label>
                    </div>
                </div>

                <!-- Botón -->
                <button type="submit" class="btn-register" id="btn-registrar">
                    <i class="bi bi-person-check-fill me-2"></i>Crear mi cuenta
                </button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePass(fieldId, iconId) {
            const input = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') { input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
            else { input.type = 'password'; icon.className = 'bi bi-eye'; }
        }

        function checkStrength(val) {
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const map = [
                { w:'0%', c:'transparent', t:'' },
                { w:'20%', c:'#ef4444', t:'Muy débil' },
                { w:'40%', c:'#f97316', t:'Débil' },
                { w:'60%', c:'#eab308', t:'Regular' },
                { w:'80%', c:'#22c55e', t:'Buena' },
                { w:'100%', c:'#10b981', t:'Excelente' },
            ];
            const s = map[Math.min(score, 5)];
            fill.style.width = s.w; fill.style.background = s.c;
            text.textContent = s.t; text.style.color = s.c;
        }

        document.getElementById('confirmarPassword').addEventListener('input', function() {
            const p1 = document.getElementById('password').value;
            const p2 = this.value;
            const msg = document.getElementById('passMatch');
            if (!p2) { msg.textContent = ''; return; }
            if (p1 === p2) { msg.textContent = '✓ Las contraseñas coinciden'; msg.style.color = '#4ade80'; }
            else { msg.textContent = '✗ No coinciden'; msg.style.color = '#f87171'; }
        });

        document.getElementById('form-registro').addEventListener('submit', function(e) {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirmarPassword').value;
            if (p1 !== p2) { e.preventDefault(); alert('Las contraseñas no coinciden.'); return; }
            const btn = document.getElementById('btn-registrar');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registrando...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
