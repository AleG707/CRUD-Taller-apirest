spring.application.name=AutoTrace-Taller-Microservicios
server.port=${PORT:8080}

# ==============================================================
# CONFIGURACIÓN MONGODB (PATRÓN DATABASE-PER-SERVICE)
# ==============================================================
# URI de conexión: Utiliza variable de entorno MONGODB_URI en Render/Nube o localhost por defecto
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}

# Bases de datos NoSQL independientes por microservicio:
database.admin.name=taller_admin_db
database.vehiculos.name=taller_clientes_db
database.ordenes.name=taller_ordenes_db
database.proveedores.name=taller_proveedores_db
database.certificaciones.name=taller_certificaciones_db

# ==============================================================
# OPENAPI / SWAGGER DOCUMENTACIÓN
# ==============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ==============================================================
# THYMELEAF & WEB CONFIGURACIÓN
# ==============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.web.resources.chain.cache=false
